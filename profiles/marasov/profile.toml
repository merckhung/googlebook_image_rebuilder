# MARASOV: ASUS Chromebook Plus CX34 (Model CX3402 / CX3402CBA / CX3402CVA, 128GB UFS, Intel Core i3-1215U, Alder Lake-U, brya/marasov)
# with MrChromebox UEFI firmware.
# Hardware summary:
#   Chassis:  14.0" FHD (1920x1080) 16:9 Clamshell with 180-degree lay-flat hinge (32.64 x 21.43 x 1.87 cm, 1.44 kg;
#             NOT a 360-degree Flip convertible — no tablet-mode lid-angle sensor, no EC accelerometers, no side volume buttons)
#   CPU:      Intel Core i3-1215U (12th Gen Alder Lake-U, 2P+4E; sibling SKUs: i5-1235U, i7-1255U, i3-1315U, i5-1335U)
#   GPU:      Intel UHD Graphics (Alder Lake-U GT1, PCI ID 8086:46b3; xe driver)
#   Storage:  128GB UFS 2.1/3.1 on Intel Alder Lake UFSHCI PCI controller (built-in ufshcd-pci in GKI 6.18.21)
#   Audio:    sof-rt5682 (ALSA id sofrt5682; Realtek ALC5682I-VS/VD headset codec on I2C0 + ALC1019P speaker amp on SSP1, SOF IPC3)
#   Wi-Fi/BT: Intel AX211NGW CNVi (iwlwifi-so-a0-gf-a0-89.ucode + intel/ibt-0040-0041.sfi)
#   Camera:   1080p FHD USB2 UVC camera with privacy shutter on usb2_port6 (SoC usb2_ports[5], supported by stock uvcvideo)
schema = 1
kmods = ["gbos_isa_emu", "ac", "gbos_wakefilter", "gbos_efifb"]

[model]
id = "marasov"
name = "ASUS Chromebook Plus CX34 (Model CX3402, 128GB UFS, i3-1215U)"
status = "experimental"
image_name = "googlebook-cx3402.img"
dmi = { sys_vendor = "Google", product_name = "Marasov" }

[entries]
quiet = "Googlebook CX3402 quiet"
debug = "Googlebook CX3402 safe serial-debug"

[cmdline]
# Stock lapis options removed for MARASOV (superseded by tail below, or lapis SoundWire mask that MARASOV lacks)
stock_drop = ["snd_intel_sdw_acpi.sdw_link_mask=0x5", "xe.enable_psr=1", "snd_sof_pci.ipc_type=1"]
# Appended to stock options of every entry; quiet drops the console/earlycon/log-level tokens again.
# 46b3 is the Intel Core i3-1215U UHD Graphics GT1 PCI ID on CX3402CBA; the remaining Alder Lake-P/U and Raptor Lake-U
# IDs cover sibling CX3402 SKUs (i5-1235U 46a8, i7-1255U 46a6, etc.).
add = ["loglevel=8", "ignore_loglevel", "earlycon=uart8250,mmio32,0xfe03e000,115200n8",
       "xe.force_probe=46b3,46a6,46a3,46a8,4626,4628,46b2,a721,a7a1,a7a9,a7ac,a7ad"]
# After the safety tail: xe on 6.18.21 faults scanning tiled framebuffers through DPT in stolen memory;
# rt1019 + rt5682 on SOF uses IPC3 (snd_sof_pci.ipc_type=0 -> sof-adl-rt1019-rt5682.tplg).
tail = ["xe.enable_dpt=0", "xe.enable_psr=0", "xe.enable_fbc=0", "snd_sof_pci.ipc_type=0"]
debug_drop = ["8250.nr_uarts=4"]
# LPSS UART 00:1e.0..2 (51a8-51aa) and fingerprint GSPI1 (51ab) go to pci-stub so intel-lpss-pci binds only
# the I2C controllers (I2C0 ALC5682I-VS audio, I2C3 ELAN0001 touchscreen, I2C5 PIXA2342/ELAN0000 touchpad).
pci_stub_ids = ["8086:51a8", "8086:51a9", "8086:51aa", "8086:51ab"]
first_stage_drop = ["8250_dw.ko", "intel-lpss-pci.ko", "intel-lpss.ko"]

[blacklist]
modules = ["cros_ec_debugfs", "tpm_tis_i2c_cr50", "cros_ec_lpcs", "cros_ec_usb", "spi_intel_pci", "spi_intel", "i2c_dev",
           "thunderbolt", "tpm", "tpm_tis", "tpm_tis_core", "tpm_tis_spi", "cros_ec", "cros_ec_dev", "cros_ec_chardev",
           "gsmi", "chromeos_acpi", "nvram", "mtd", "spi_nor", "spidev", "intel_quicki2c", "intel_quickspi",
           "at24", "cros_hps_i2c", "i2c_cros_ec_tunnel", "cros_peripheral_charger",
           "cros_ec_spi", "cros_ec_i2c", "cros_ec_ishtp", "cros_ec_sysfs", "cros_ec_vbc", "cros_ec_typec", "cros_typec_switch",
           "cros_usbpd_notify", "cros_usbpd_charger", "cros_usbpd_logger", "cros_charge_control", "cros_ec_ucsi", "cros_ec_keyb",
           "cros_ec_sensorhub", "cros_ec_sensors_core", "cros_ec_sensors", "cros_ec_accel_legacy", "cros_ec_baro",
           "cros_ec_lid_angle", "cros_ec_light_prox", "cros_ec_lightbar", "cros_ec_pwrmon", "cros_ec_cec", "leds_cros_ec",
           "hid_google_hammer", "wilco_ec", "wilco_charger", "wilco_ec_debugfs", "wilco_ec_telem", "rtc_wilco_ec"]
debug_add = ["8250_dw", "intel_lpss_acpi"]
allow = ["cros_ec_proto", "cros_kbd_led_backlight"]

[firmware_sources]
linux_firmware_tag = "20260810"
sof_bin_url = "https://github.com/thesofproject/sof-bin/releases/download/v2025.12.2/sof-bin-2025.12.2.tar.gz"
sof_bin_sha256 = "533f63e3a6d94c09ce05a782657b675fa683ff20787c0979226cf563ec79f517"

[[firmware]]                         # ADL-U/P display microcontroller, GuC, HuC (xe)
path = "i915/adlp_dmc.bin"
from = "linux-firmware"
src = "i915/adlp_dmc.bin"
sha256 = "3516de2e134ddcf3b319c75d2e437779fecbd58cbb77234bd6f297c544e92ccb"
[[firmware]]
path = "i915/adlp_guc_70.bin"
from = "linux-firmware"
src = "i915/adlp_guc_70.bin"
sha256 = "b7a800cbdcdf687e7b1c81f3316d040ab75fa3e5c698ebc356f077af17462ef8"
[[firmware]]
path = "i915/tgl_huc.bin"
from = "linux-firmware"
src = "i915/tgl_huc.bin"
sha256 = "dbb1316bac13a76427ffa7827e52b5b9affe8a4cadd23dc22e2a54e35c53bdad"
[[firmware]]                         # AX211 Wi-Fi (iwlmvm)
path = "iwlwifi-so-a0-gf-a0-89.ucode"
from = "linux-firmware"
src = "intel/iwlwifi/iwlwifi-so-a0-gf-a0-89.ucode"
sha256 = "7b53254bb28115f91b6eaa33b1f9a3526e32966105eaac587e259dd17790f384"
[[firmware]]
path = "iwlwifi-so-a0-gf-a0.pnvm"
from = "linux-firmware"
src = "intel/iwlwifi/iwlwifi-so-a0-gf-a0.pnvm"
sha256 = "2aee7592ddbd6c88f1aa51be4ada188fce44765405e52d7f3056b46e62cf3f91"
[[firmware]]                         # AX211 Bluetooth
path = "intel/ibt-0040-0041.sfi"
from = "linux-firmware"
src = "intel/ibt-0040-0041.sfi"
sha256 = "8dcfb3a7c1592c11c3e80505d21ee78dbde3de0c830d8e3e856371c37717b62c"
[[firmware]]
path = "intel/ibt-0040-0041.ddc"
from = "linux-firmware"
src = "intel/ibt-0040-0041.ddc"
sha256 = "fe272982577efdc289cfe3e8bedafca607c0b7d6c9df1aab1880e22ef930d077"
[[firmware]]                         # SOF DSP (IPC3; ADL uses the TGL image) and rt1019 + rt5682 topology
path = "intel/sof/community/sof-adl.ri"
from = "sof-bin"
src = "sof-bin-2025.12.2/sof/community/sof-tgl.ri"
sha256 = "e3489dcb277e87eee8bc091ab7d51163a63c85541c22522775122b54263769f3"
[[firmware]]
path = "intel/sof/sof-adl.ri"
from = "sof-bin"
src = "sof-bin-2025.12.2/sof/intel-signed/sof-adl.ri"
sha256 = "294e5a51b1d3fc4ceda57780927c2a2ec95bb5d23477f879a9fb648c6c01cb30"
[[firmware]]
path = "intel/sof-tplg/sof-adl-rt1019-rt5682.tplg"
from = "sof-bin"
src = "sof-bin-2025.12.2/sof-tplg/sof-adl-rt1019-rt5682.tplg"
sha256 = "b0c08e8f0ef9067320b2f4251d110c57dfa28498827639b8250ec056d390675e"
[[firmware]]
path = "intel/sof-tplg/sof-adl-rt5682.tplg"
from = "sof-bin"
src = "sof-bin-2025.12.2/sof-tplg/sof-adl-rt5682.tplg"
sha256 = "457886fdcdcaa5bad3a7b4868a3e76d4c98c0c1d02f59a1718a2edc9ac789afe"

[audio]
# card sof-rt5682 (Realtek ALC5682I-VS/VD headset + ALC1019P speaker amp, SOF IPC3); DRAS files written by vendor.py
card = "sof-rt5682"
config_dir = "sof-rt5682_marasov"
sources = "audio-src.list"

[wifi]
modprobe = ["iwlmvm"]

[display]
stack = "native"
fallback = "gop-swiftshader"
hwc_backend = "client"
build_prop_set = [["vendor.hwc.drm.enable_color_pipeline", "true", "false"],
                  ["vendor.hwc.drm.force_color_mode", "13", "0"],
                  ["vendor.hwc.drm.persistent_hdr", "true", "false"],
                  ["vendor.hwc.use_log_gamma_lut", "true", "false"],
                  ["ro.surface_flinger.has_wide_color_display", "true", "false"],
                  ["ro.surface_flinger.has_HDR_display", "true", "false"]]

[input]
kbd_backlight_leds = "/sys/devices/platform/GOOG0004:00/GOOG0002:00/leds"
power_button = "acpi"

[camera]
# MARASOV uses a USB2 UVC camera on usb2_port6 (supported by stock uvcvideo), not MIPI IPU6
libcamera = false

[hooks]
vendor = "vendor.py"
